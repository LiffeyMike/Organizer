services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: organizer
      POSTGRES_USER: organizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organizer"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: app/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/organizer
      SPRING_DATASOURCE_USERNAME: organizer
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  pgdata:
